server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/uwtracker
spring.datasource.username=uwtracker
spring.datasource.password=uwtracker
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

# SpaFallbackController's catch-all mapping ("/**/{path:[^.]*}") mixes ** with a trailing
# regex-constrained variable -- valid AntPathMatcher syntax, but rejected outright at startup by
# Spring Boot 3's default PathPatternParser ("No more pattern data allowed after {*...} or **
# pattern element"). Never caught before this project's first real integration test actually booted
# the full web MVC context -- mvn compile/test alone never triggers HandlerMapping initialization.
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=7d

# Cloud Run terminates TLS and forwards to the container over plain HTTP internally, setting
# X-Forwarded-Proto: https on the request. Without this, Tomcat has no way to know the original
# request was HTTPS, so the session cookie's Secure flag (auto-detected from request.isSecure())
# would never get set even though it should. No-op locally: harmless when no forwarded headers
# are present (plain http://localhost), since there's nothing for it to trust in that case.
server.forward-headers-strategy=framework
